unbind C-b
set -g prefix C-Space

set -g mouse off
set -g history-limit 100000
set -g base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on
set -g set-clipboard on

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

setw -g mode-keys vi
set -g status-keys vi
bind Escape copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi V   send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

set -g status-left ""
set -g status-justify left
set -g status-style "bg=default,fg=#565f89"
setw -g window-status-current-style "fg=#7aa2f7,bold"

set -g pane-border-status bottom
set -g pane-border-format ""
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#3b4261"

if-shell '[ -n "$SSH_CONNECTION" ]' {
  set -g prefix C-b
  set -g status-right "[#S] <C-b>"
} {
  set -g status-right "[#S] <C-Space>"
}

bind r source-file ~/.tmux.conf \; display-message "reloaded"
